# Supabase local, só para testes (CI e sessão do agente). Não vale para produção.
# Sobe com `supabase start` e aplica supabase/migrations do zero. Chaves locais vêm de
# `supabase status -o env` na hora de rodar; nenhuma fica no repositório.
project_id = "minhas-passagens"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Igual à produção desde a mudança do Supabase de 30/10: tabela nova só responde
# à API com GRANT explícito (scripts/migracoes.test.mjs trava isso).
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# Dados de teste são criados pelos próprios testes, com usuários fictícios.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Só aqui: os testes criam usuários fictícios com e-mail e senha.
# Em produção o login é só pelo Google e o cadastro está fechado.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false
max_frequency = "1s"
