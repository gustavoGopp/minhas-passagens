name: CI

# Roda em todo pull request e na main. O único check exigido na proteção da
# main é o "gate", no fim deste arquivo.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # O .npmrc (quarentena de versões novas, scripts de instalação desligados)
      # exige npm 11.10 ou mais novo. Versão fixada; atualizar à mão de tempos em tempos.
      - name: npm que entende o .npmrc
        run: npm install -g npm@11.21.2
      - run: npm ci
      - name: Migração que já está na main não se edita
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          alteradas=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations)
          if [ -n "$alteradas" ]; then
            echo "::error::Estas migrações já rodaram em produção e foram alteradas ou apagadas. Crie uma migração nova: $alteradas"
            exit 1
          fi
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high
      # O mesmo comando que o agente e o dono rodam: lint, formatação, tipos, testes e build.
      - run: npm run verify
      - name: Detalhe da verificação
        if: ${{ failure() }}
        run: cat .verificar.log || true

  # Único check exigido na proteção da main. Sempre roda e só passa se todos
  # os outros jobs passaram: um job pulado não conta como aprovado.
  gate:
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os outros jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTADOS; do
            if [ "$r" != "success" ]; then
              echo "::error::Há job que não passou ($RESULTADOS). O merge fica bloqueado."
              exit 1
            fi
          done
          echo "Todos os jobs passaram."
