name: Supabase — migrações

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency: supabase-migrate

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Restrito à main: nenhum outro branch recebe a credencial. A aprovação por
    # clique e a ordem em relação ao deploy entram com a proposta P18.
    environment: producao-rotina
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gbvwzwpuzlaftinfcxkc' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/supabase-migrate.mjs
