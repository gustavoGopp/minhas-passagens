# Backup semanal do banco, cifrado antes de virar artefato (o repositório e os
# logs são públicos). Exporta as tabelas do schema public + auth.users/identities
# em JSON, compacta e cifra com GPG (AES-256) usando o segredo BACKUP_PASSPHRASE.
# Retenção: 28 dias. Restauração: workflow "Supabase — restaurar backup".
name: Supabase — backup

on:
  schedule:
    - cron: "23 6 * * 0" # domingo, 03:23 em Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: "backup (cifra e guarda) ou teste (exporta e simula a restauração com rollback, sem guardar nada)"
        required: true
        default: backup
        type: choice
        options: [backup, teste]

concurrency: supabase-backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gbvwzwpuzlaftinfcxkc' }}
      MODO: ${{ inputs.modo || 'backup' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir a senha do backup
        if: ${{ env.MODO == 'backup' }}
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::Crie o segredo BACKUP_PASSPHRASE (16+ caracteres) em Settings → Secrets and variables → Actions. Nada foi exportado."
            exit 1
          fi
      - name: Exportar
        run: node scripts/supabase-backup.mjs "$RUNNER_TEMP/backup"
      - name: Simular restauração (rollback)
        if: ${{ env.MODO == 'teste' }}
        run: node scripts/supabase-restore.mjs "$RUNNER_TEMP/backup" --simular
      - name: Cifrar
        if: ${{ env.MODO == 'backup' }}
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/backup.tar.gz" -C "$RUNNER_TEMP" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "$RUNNER_TEMP/out/supabase-$(date -u +%F).tar.gz.gpg" "$RUNNER_TEMP/backup.tar.gz" \
            3<<<"$BACKUP_PASSPHRASE"
          ls -l "$RUNNER_TEMP/out" | tail -n +2 | awk '{print $5 " bytes"}'
      - name: Apagar a cópia sem cifra
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/backup" "$RUNNER_TEMP/backup.tar.gz"
      - name: Guardar artefato cifrado (28 dias)
        if: ${{ env.MODO == 'backup' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: ${{ runner.temp }}/out/*.gpg
          retention-days: 28
          if-no-files-found: error
