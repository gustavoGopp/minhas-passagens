name: Supabase — notificações e agendador

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de produção do app"
        required: true
        default: https://minhas-passagens.vercel.app

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    # Só a partir da main e só depois de o dono aprovar a execução no GitHub.
    environment: producao-risco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A instalação de pacotes roda sem nenhuma credencial no ambiente: código
      # de terceiros não enxerga os segredos de produção (revisão de novembro, S1).
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - name: Migrações e agendador
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gbvwzwpuzlaftinfcxkc' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROD_TELEGRAM_BOT_TOKEN }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          node scripts/supabase-migrate.mjs
          node scripts/supabase-setup-jobs.mjs
