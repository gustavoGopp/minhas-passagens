# Diagnóstico do Supabase: só leitura e sem dados pessoais (os logs deste
# repositório são públicos). Roda no ambiente producao-rotina, restrito à main:
# uma consulta nova precisa entrar na main antes de poder rodar.
name: Supabase — diagnóstico

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Arquivo de supabase/diagnostics, auth-logs ou auth-config"
        required: true
        default: estado-schema.sql

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    environment: producao-rotina
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gbvwzwpuzlaftinfcxkc' }}
      ALVO: ${{ inputs.alvo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Diagnóstico (somente leitura)
        run: node scripts/supabase-diagnostico.mjs "$ALVO"
